# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Integral Matrices of Fixed Rank over Number Fields: Lean formalization"
  description: >-
    A Lean formalization of the fixed-rank asymptotic count for integral
    matrices over a number field and the convergence of moments of lifts of
    algebraic codes. The public results preserve the submission PDF's main scale,
    error terms, echelon-integral limit, and denominator normalization. The
    intermediate-rank height-counting input attributed to Schmidt is an
    explicit hypothesis; it is not silently assumed as an axiom.
  authors:
    - "Nihar Gargava"
  license: "GPL-3.0"
  responsible_maintainers:
    - "Nihar Gargava"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11R04", "11H06"]

sources:
  - title: "Integral matrices of fixed rank over number fields"
    authors:
      - "Nihar Gargava"
      - "Vlad Serban"
      - "Maryna Viazovska"
      - "Ilaria Viglino"
    id: "arXiv:2510.11673"
    type: "paper"
    location: "https://arxiv.org/abs/2510.11673"
    relationship: "formalizes"
    license: "unknown"
  - title: "On Heights of Algebraic Subspaces and Diophantine Approximations"
    authors:
      - "Wolfgang M. Schmidt"
    id: "doi:10.2307/1970360"
    type: "paper"
    location: "https://doi.org/10.2307/1970360"
    relationship: "background"
    note: >-
      Schmidt's height-counting result is represented by the explicit
      HasHeightCountBounds hypothesis used for intermediate ranks.
  - title: "Short Bases of Lattices over Number Fields"
    authors:
      - "Claus Fieker"
      - "Damien Stehlé"
    id: "doi:10.1007/978-3-642-14518-6_15"
    type: "paper"
    location: "https://doi.org/10.1007/978-3-642-14518-6_15"
    relationship: "adapts"
    note: >-
      Theorem 2 is the source of the number-field successive-minima/product
      estimate; its selection argument is formalized in
      Katznelson/Counting/FiekerStehle.lean.
  - title: "Integral matrices of fixed rank"
    authors:
      - "Yonatan R. Katznelson"
    id: "doi:10.2307/2160455"
    type: "paper"
    location: "https://doi.org/10.2307/2160455"
    relationship: "adapts"
    note: >-
      Source of the original fixed-rank integral-matrix and Abel-summation
      strategy generalized in the submission PDF and Lean development.
  - title: "An Asymptotic Estimate for Heights of Algebraic Subspaces"
    authors:
      - "Jeffrey Lin Thunder"
    id: "doi:10.2307/2154015"
    type: "paper"
    location: "https://doi.org/10.2307/2154015"
    relationship: "background"
    note: >-
      Source of the sharper effective height asymptotic cited for context;
      Schmidt's height-counting bound remains the explicit logical input.
  - title: "Moments of the number of points in a bounded set for number field lattices"
    authors:
      - "Nihar Gargava"
      - "Vlad Serban"
      - "Maryna Viazovska"
    id: "arXiv:2308.15275"
    type: "paper"
    location: "https://arxiv.org/abs/2308.15275"
    relationship: "background"
    note: >-
      Source of the height/denominator relationship and the convergence
      provenance for the echelon/Grassmannian expression.

related_formalizations:
  - id: "https://github.com/nihargargava/MeanValueIdealLattices"
    relationship: "builds-on"
    note: >-
      Reuses and ports GPL-3.0 metric and covolume formalization ideas from
      the author's earlier formalization, with attribution in
      notes/source-attribution.md and the affected Lean files.

status:
  scope: >-
    The formalization proves the two main theorem paths in the cited
    submission PDF: the fixed-rank count and the higher-moment convergence for
    lifts of codes. Schmidt's intermediate-rank height count remains an
    explicit hypothesis. The admissibility/Riemann subsystem uses the
    author-approved raw Euclidean mixed-space convention, while exact
    coefficient measures and covolume normalizations are bridged to the
    submission PDF. The exceptional critical-radius and large-radius Riemann
    branches are documented local adaptations in this metadata and committed
    Lean comments. The author-supplied submission PDF is the primary statement
    source; it is identified by its fingerprint in notes/source-attribution.md
    and is not included in this repository snapshot.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["GPT-5 / Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "AI-assisted formalization with author-directed mathematical review"
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        The development was produced through iterative proof, audit, and
        submission-PDF-fidelity prompts, with explicit review of mathematical
        issues and provenance.
  notes: >-
    The author directed the formalization and reviewed the statement
    correspondence, adaptations, citations, and final trust audit.

fidelity:
  divergences: >-
    The public theorem path is conditional on the explicit Schmidt
    height-count interface. The admissibility/Riemann implementation uses
    Mathlib's raw Euclidean mixed-space metric rather than making the
    submission PDF's discriminant-scaled trace metric a global typeclass; exact
    main-term normalization is proved separately. The approved critical
    radius and large-radius Riemann adaptations are recorded in the committed
    Lean comments and this metadata.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The formal statements were audited against the cited submission PDF, public
    theorem paths were built with the pinned toolchain, and the final
    declarations were checked for project-specific axioms, sorryAx, and
    other hidden proof placeholders.

alignment:
  namespace: "Katznelson.Palomar"
  statements:
    - source: "Theorem 2 (submission PDF, p. 2; proof pp. 20--22)"
      lean: "Katznelson.Palomar.fixed_rank_count"
      module: "Challenge"
      status: "proved"
      note: >-
        The Solution declaration has exactly the Challenge type and calls
        Katznelson.fixed_rank_count; the Schmidt input remains explicit.
    - source: "Theorem 42 (submission PDF, p. 24; proof pp. 24--25)"
      lean: "Katznelson.Palomar.lifts_of_codes_convergence"
      module: "Challenge"
      status: "proved"
      note: >-
        The Solution declaration has exactly the Challenge type and calls
        Katznelson.lifts_of_codes_convergence.

acknowledgements: >-
  Mathlib, the Lean community infrastructure, and Nihar Gargava's earlier
  MeanValueIdealLattices formalization, used under its GPL-3.0 license.
